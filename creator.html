<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet the creator and learn about their interests, hobbies, and dreams.">
  <title>Meet the Creator Project</title>
  <style>
    :root {
      --ink: #172d27;
      --muted: #65756d;
      --green: #26745a;
      --paper: #f5f6f1;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(ellipse at 50% 0%, #e6eee7 0, var(--paper) 55%); font-family: Arial, Helvetica, sans-serif; line-height: 1.65; }
    .topnav { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; padding: 18px 20px; }
    .topnav a { padding: 9px 14px; border-radius: 999px; color: var(--muted); font-size: .92rem; text-decoration: none; transition: background .2s, color .2s; }
    .topnav a:hover, .topnav a:focus-visible { background: #e8eee8; color: var(--ink); }
    .topnav a.active { background: var(--ink); color: white; }
    main { width: min(100% - 40px, 820px); margin: 64px auto 72px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) 220px; align-items: center; gap: 36px; padding: clamp(24px, 5vw, 48px); border: 1px solid rgb(23 45 39 / 7%); border-radius: 24px; background: rgb(255 255 255 / 92%); box-shadow: 0 24px 70px rgb(28 54 42 / 9%); }
    .intro-copy { min-width: 0; }
    .photo { width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; background: #edf2ee; object-fit: cover; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { max-width: 650px; margin-bottom: 8px; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.08; }
    .lead { max-width: 600px; margin-bottom: 0; color: var(--muted); }
    .content-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; margin-top: 28px; }
    .card { padding-top: 8px; }
    .card h2 { margin-bottom: 8px; font-size: 1.2rem; }
    .card p { margin-bottom: 0; color: var(--muted); }
    .quote { grid-column: 1 / -1; }
    blockquote { margin: 0; color: var(--muted); font-size: 1.05rem; }
    .quote p { margin-top: 10px; }
    footer { padding: 0 20px 30px; color: var(--muted); text-align: center; font-size: .9rem; }
    @media (max-width: 620px) {
      .topnav { padding-inline: 12px; }
      main { width: min(100% - 24px, 980px); margin-top: 24px; }
      .intro { grid-template-columns: 1fr; gap: 22px; }
      .photo { width: min(100%, 240px); aspect-ratio: 1; }
      .content-grid { grid-template-columns: 1fr; }
      .quote { grid-column: auto; }
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="skillstest.html">Element Checker</a>
    <a href="drill2.html">School Club Members</a>
    <a class="active" href="creator.html" aria-current="page">Meet the Creator</a>
    
  </nav>
  <main id="home">
    <section class="intro" id="meet-the-creator" aria-labelledby="page-title">
      <div class="intro-copy">
        <p class="eyebrow">Meet the creator</p>
        <h1 id="page-title">Hi, I’m Lorenzo.</h1>
        <p class="lead">I’m a student interested in technology, basketball, guitar, and public service. I hope to follow my father and grandfather into a career in government.</p>
      </div>
      <img class="photo" src="IMG_3005 .jpeg" alt="A portrait of Lorenzo">
    </section>
  </main>
</body>
</html>
