<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Check your membership in the ICT Club.">
  <title>ICT Club | Member Check</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <style>
    :root {
      --ink: #172d27;
      --muted: #65756d;
      --green: #26745a;
      --paper: #f5f6f1;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(ellipse at 50% 0%, #e6eee7 0, var(--paper) 55%); font-family: Arial, Helvetica, sans-serif; line-height: 1.65; }
    .topnav { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; padding: 18px 20px; }
    .topnav a { padding: 9px 14px; border-radius: 999px; color: var(--muted); font-size: .92rem; text-decoration: none; transition: background .2s, color .2s; }
    .topnav a:hover, .topnav a:focus-visible { background: #e8eee8; color: var(--ink); }
    .topnav a.active { background: var(--ink); color: white; }
    main { display: grid; min-height: calc(100vh - 66px); place-items: start center; padding: clamp(35px, 9vh, 90px) 20px 60px; }
    .panel { width: min(100%, 520px); padding: clamp(28px, 6vw, 48px); border: 1px solid rgb(23 45 39 / 7%); border-radius: 24px; background: rgb(255 255 255 / 92%); box-shadow: 0 24px 70px rgb(28 54 42 / 9%); }
    .eyebrow { margin: 0 0 12px; color: var(--green); font-size: .76rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.05em; line-height: 1.08; }
    .description { margin: 0 0 28px; color: var(--muted); }
    .fields { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; color: var(--ink); font-size: .9rem; font-weight: 600; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #dce5df; border-radius: 11px; background: #fbfcfa; color: var(--ink); font: inherit; }
    input:focus { outline: 3px solid rgb(38 116 90 / 16%); border-color: var(--green); }
    button { width: 100%; margin-top: 20px; padding: 12px 16px; border: 0; border-radius: 11px; background: var(--ink); color: white; font: inherit; font-weight: 700; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: var(--green); transform: translateY(-1px); }
    #result { min-height: 1.65em; margin: 18px 0 0; color: var(--green); font-weight: 600; }
    @media (max-width: 520px) { .topnav { padding-inline: 10px; } main { padding-inline: 14px; } .panel { border-radius: 20px; } }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Main navigation">
    <a class="active" href="index.html" aria-current="page">Home</a>
    <a href="skillstest.html">Element Checker</a>
    <a href="clubmembers">School Club Members</a>
    <a href="creator.html">Meet the Creator</a>
  </nav>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">ICT Club</p>
      <h1 id="page-title">Member check</h1>
      <p class="description">Enter your name to see if you’re on the club list.</p>
      <form>
        <div class="fields" id="ICTmembers">
          <label for="First_Name">First name<input id="First_Name" type="text" placeholder="Your first name" autocomplete="given-name"></label>
          <label for="Last_Name">Last name<input id="Last_Name" type="text" placeholder="Your last name" autocomplete="family-name"></label>
        </div>
        <button type="button" py-click="check_member">Check membership</button>
        <p id="result" role="status" aria-live="polite"></p>
      </form>
      <py-script src="main.py"></py-script>
    </section>
  </main>
</body>
</html>
